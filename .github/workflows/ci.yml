name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines field allows the 22 LTS line and everything from 24 up.
        node: ['22.19.0', '24']
    # The check job only reads the repository; a dependency that tries to write
    # a release or a comment should fail on permissions instead of succeeding.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The test suite reads the built client bundle, so build before testing.
      - run: pnpm build
      - run: pnpm test
